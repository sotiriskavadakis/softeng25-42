openapi: 3.0.0
info:
  title: EV Charging Network API
  version: 1.0.0
  description: |
    # Comprehensive REST API for EV Charging Station Management
    
    ## Overview
    
    The EV Charging Network API provides complete management and monitoring of electric vehicle charging stations.
    It enables user authentication, charging point discovery, reservations, session tracking, and administrative operations.
    
    ## Core Features
    
    ### 🔐 Authentication & Authorization
    - **JWT-based authentication** with 24-hour token validity
    - **Role-based access control** for different user types
    - **Secure password hashing** using bcrypt
    - **Email verification** and user profile management
    
    ### 📍 Charging Point Management
    - **Real-time point discovery** with geographic filtering
    - **Multi-criteria search**: by status, location (coordinates or bounding box), availability
    - **Detailed point information**: capacity, pricing, reservation status
    - **Status change history**: track all state transitions over time
    
    ### 🔄 Reservation System
    - **Atomic reservations** with row-level database locking
    - **Race-condition-proof** implementation
    - **Flexible durations**: 15-60 minutes (30 min default)
    - **Real-time availability** checking
    
    ### ⚡ Session Management
    - **Complete session recording**: start/end times, energy delivered, battery state changes
    - **Billing integration**: pricing per kWh, total amounts
    - **Historical data**: full audit trail of all charging sessions
    - **CSV export** capability for reporting
    
    ### 💰 Pricing Management
    - **Dynamic pricing** support with manual overrides
    - **Point-level pricing**: different rates for different locations
    - **Price history tracking**: monitor pricing changes
    
    ### 📊 Admin Operations
    - **Bulk data import**: CSV upload for charging point data
    - **Health monitoring**: database connectivity and system status
    - **Statistical reporting**: online/offline point counts
    
    ## Authentication Details
    
    ### JWT Token Structure
    All endpoints except `/auth/*` and `/admin/healthcheck` require Bearer token authentication.
    
    ```
    Authorization: Bearer <jwt_token>
    ```
    
    **Token Lifetime**: 24 hours from issue
    
    **Token Claims** (example decoded):
    ```json
    {
      "sub": "user_id_12345",
      "email": "user@example.com",
      "name": "John Doe",
      "iat": 1674321200,
      "exp": 1674407600
    }
    ```
    
    ### Obtaining a Token
    
    **Option 1: Register New Account**
    ```
    POST /auth/register
    ```
    Returns JWT immediately after successful registration.
    
    **Option 2: Login with Existing Credentials**
    ```
    POST /auth/login
    ```
    Returns JWT upon successful authentication.
    
    ### Token Expiration
    
    When token expires (401 Unauthorized response):
    1. Call `/auth/login` with current credentials
    2. Extract new token from response
    3. Update Authorization header with new token
    
    ## Data Formats & Standards
    
    ### DateTime Format
    **Format**: `YYYY-MM-DD HH:MM` (24-hour time)
    
    **Examples**:
    - `2025-12-25 14:30` (2:30 PM on Christmas 2025)
    - `2026-01-05 04:25` (4:25 AM on January 5, 2026)
    - `2025-12-25 00:00` (midnight)
    
    **Timezone**: All times in server/database timezone (UTC by default)
    
    ### Date-Only Format
    **Format**: `YYYYMMDD`
    
    **Examples**:
    - `20251225` (December 25, 2025)
    - `20260105` (January 5, 2026)
    
    **Usage**: Date range queries (from/to parameters)
    
    ### Coordinate Format
    **Format**: WGS84 decimal degrees
    
    **Examples**:
    - Latitude: `37.9838` (Central Athens)
    - Longitude: `23.7275` (Central Athens)
    - Latitude: `37.7749` (San Francisco)
    - Longitude: `-122.4194` (San Francisco)
    
    ### Numeric Precision
    
    **Price (€/kWh)**
    - Type: Decimal
    - Precision: 2 decimal places
    - Example: `0.35` (€0.35/kWh)
    - Range: 0.00 - 999.99
    
    **Energy (kWh)**
    - Type: Decimal
    - Precision: 1 decimal place
    - Example: `45.5` (45.5 kilowatt-hours)
    - Range: 0.0 - 9999.9
    
    **Capacity (kW)**
    - Type: Integer
    - Example: `22` (22 kilowatts)
    - Range: 0 - 999
    
    **State of Charge (%)**
    - Type: Integer
    - Range: 0 - 100
    - Example: `80` (80% battery)
    
    ## Status Values
    
    ### Charging Point Status
    - **AVAILABLE**: Ready for immediate use, no reservation
    - **OCCUPIED**: Currently charging, actively in use
    - **RESERVED**: Reserved by another user, not currently charging
    - **FAULTED**: Hardware malfunction detected, requires service
    - **OFFLINE**: Not operational, maintenance or disconnected
    
    **Status Transitions**:
    ```
    AVAILABLE ↔ OCCUPIED (charging starts/ends)
    AVAILABLE ↔ RESERVED (user reserves/cancels)
    Any Status → FAULTED (malfunction detected)
    Any Status → OFFLINE (maintenance/disconnect)
    FAULTED ↔ OFFLINE (service operations)
    ```
    
    ## Error Handling
    
    ### Standard Error Response Format
    ```json
    {
      "error_code": "ERROR_TYPE",
      "error_message": "Human-readable error description",
      "timestamp": "2025-12-25 14:30"
    }
    ```
    
    ### Common Error Codes
    | Code | HTTP Status | Meaning | Cause |
    |------|------------|---------|-------|
    | `VALIDATION_ERROR` | 400 | Input validation failed | Missing/invalid required fields |
    | `INVALID_REQUEST` | 400 | Bad request format | Malformed JSON or parameters |
    | `INVALID_CREDENTIALS` | 401 | Wrong email/password | Incorrect login credentials |
    | `UNAUTHORIZED` | 401 | Missing/invalid token | No token or token expired |
    | `DUPLICATE_EMAIL` | 409 | Email already exists | Attempted registration with existing email |
    | `NOT_FOUND` | 404 | Resource doesn't exist | Point/session doesn't exist |
    | `DATABASE_ERROR` | 500 | Database operation failed | Connection, constraint, or query error |
    | `INTERNAL_ERROR` | 500 | Unexpected server error | Unhandled exception |
    
    ### Error Handling Best Practices
    
    1. **Always check HTTP status code** - Indicates error category
    2. **Parse error_code** - Machine-readable identifier for programmatic handling
    3. **Read error_message** - Human-readable description for user feedback
    4. **Implement retries** - For 500 errors, implement exponential backoff
    5. **Handle 401 gracefully** - Prompt user to re-authenticate
    
    ## Rate Limiting
    
    **Current Status**: No rate limiting applied
    
    For production deployments, contact support team to discuss:
    - Rate limit requirements per API key
    - Burst allowances
    - Retry-After header handling
    
    ## Pagination & Large Datasets
    
    **CSV Export**: For large datasets, use `format=csv` parameter:
    ```
    GET /points?status=AVAILABLE&format=csv
    ```
    
    This returns data in CSV format suitable for spreadsheet analysis and large-scale imports.
    
