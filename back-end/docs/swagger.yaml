basePath: /api/v1
definitions:
  handlers.AddPointsResponse:
    description: Response body containing import status and row count
    properties:
      imported_rows:
        description: Number of rows successfully imported
        example: 150
        type: integer
      status:
        description: Status of the import operation
        example: OK
        type: string
    type: object
  handlers.ErrorLogResponse:
    description: Standard error response body containing details about the error occurrence
    properties:
      call:
        description: The API endpoint/URL that was called
        example: /getpoint/123
        type: string
      debuginfo:
        description: Detailed debug information about the error
        example: Point with ID 123 not found
        type: string
      error:
        description: Short error title/description
        example: Not Found
        type: string
      originator:
        description: IP address or identifier of the request originator
        example: 192.168.1.100
        type: string
      return_code:
        description: HTTP status code returned
        example: 404
        type: integer
      timeref:
        description: 'Timestamp when the error occurred (format: YYYY-MM-DD HH:MM)'
        example: 2025-12-25 14:30
        type: string
    type: object
  handlers.HealthCheckResponse:
    description: Response containing system health information and charging point
      statistics
    properties:
      dbconnection:
        description: Database connection string (DSN)
        example: postgres://user:***@localhost:5432/evcharging
        type: string
      n_charge_points:
        description: Total number of charging points in the system
        example: 1500
        type: integer
      n_charge_points_offline:
        description: Number of offline charging points
        example: 80
        type: integer
      n_charge_points_online:
        description: Number of online charging points (available, charging, reserved,
          malfunction)
        example: 1420
        type: integer
      status:
        description: Overall system status (OK if healthy)
        example: OK
        type: string
    type: object
  handlers.NewSessionRequest:
    description: Request body containing all details of a completed charging session
    properties:
      amount:
        description: Total amount charged for the session in local currency
        example: 15.93
        type: number
      endsoc:
        description: Battery state of charge at session end (percentage 0-100)
        example: 80
        type: integer
      endtime:
        description: Session end time in format 'YYYY-MM-DD HH:MM'
        example: 2025-12-25 11:30
        type: string
      kwhprice:
        description: Price per kWh at the time of the session
        example: 0.35
        type: number
      pointid:
        description: ID of the charging point where the session occurred
        example: "123"
        type: string
      startsoc:
        description: Battery state of charge at session start (percentage 0-100)
        example: 20
        type: integer
      starttime:
        description: Session start time in format 'YYYY-MM-DD HH:MM'
        example: 2025-12-25 10:00
        type: string
      totalkwh:
        description: Total energy delivered during the session in kWh
        example: 45.5
        type: number
    required:
    - amount
    - endsoc
    - endtime
    - kwhprice
    - pointid
    - startsoc
    - starttime
    - totalkwh
    type: object
  handlers.PointDetailDTO:
    description: Detailed response containing all information about a specific charging
      point
    properties:
      cap:
        description: Maximum charging capacity in kW
        example: 22
        type: integer
      is_manual_price:
        description: Whether the price is manually set or dynamically calculated
        example: false
        type: boolean
      kwhprice:
        description: Current price per kWh in local currency
        example: 0.35
        type: number
      lat:
        description: Latitude coordinate of the charging point location
        example: "37.983810"
        type: string
      lon:
        description: Longitude coordinate of the charging point location
        example: "23.727539"
        type: string
      pointid:
        description: Unique identifier of the charging point
        example: "123"
        type: string
      reservationendtime:
        description: End time of current reservation (current time if not reserved)
        example: 2025-12-25 14:30
        type: string
      status:
        description: Current status of the charging point (available, charging, reserved,
          malfunction, offline)
        example: available
        type: string
    type: object
  handlers.PointVague:
    description: Summary information about a charging point for list views
    properties:
      cap:
        description: Maximum charging capacity in kW
        example: 22
        type: integer
      lat:
        description: Latitude coordinate of the charging point
        example: "37.983810"
        type: string
      lon:
        description: Longitude coordinate of the charging point
        example: "23.727539"
        type: string
      pointid:
        description: Unique identifier of the charging point
        example: "123"
        type: string
      providerΝame:
        description: Name of the charging network provider
        example: EMPower
        type: string
      status:
        description: Current status of the charging point
        example: available
        type: string
    type: object
  handlers.ReserveResponseDTO:
    description: Response containing the result of a reservation request
    properties:
      pointid:
        description: ID of the charging point
        example: "123"
        type: string
      reservationendtime:
        description: 'End time of the reservation (format: YYYY-MM-DD HH:MM), or ''1970-01-01
          00:00'' if reservation failed'
        example: 2025-12-25 15:00
        type: string
      status:
        description: |-
          Result status: 'reserved' if successful, 'not_found' if point doesn't exist,
          or current status if point is not available for reservation
        example: reserved
        type: string
    type: object
  handlers.ResetPointsResponse:
    description: Response confirming successful reset of charging points data
    properties:
      status:
        description: Status of the reset operation
        example: OK
        type: string
    type: object
  handlers.SessionDTO:
    description: Details of a completed charging session including timing, energy,
      and billing information
    properties:
      amount:
        description: Total amount charged for the session in local currency
        example: 15.93
        type: number
      endsoc:
        description: Battery state of charge at session end (percentage 0-100)
        example: 80
        type: integer
      endtime:
        description: 'End time of the charging session (format: YYYY-MM-DD HH:MM)'
        example: 2025-12-25 11:30
        type: string
      kwhprice:
        description: Price per kWh at the time of the session
        example: 0.35
        type: number
      startsoc:
        description: Battery state of charge at session start (percentage 0-100)
        example: 20
        type: integer
      starttime:
        description: 'Start time of the charging session (format: YYYY-MM-DD HH:MM)'
        example: 2025-12-25 10:00
        type: string
      totalkwh:
        description: Total energy delivered during the session in kWh
        example: 45.5
        type: number
    type: object
  handlers.StatusChangeDTO:
    description: Record of a status change event including timestamp and state transition
    properties:
      new_state:
        description: New status after the change
        example: charging
        type: string
      old_state:
        description: Previous status before the change
        example: available
        type: string
      timeref:
        description: 'Timestamp when the status change occurred (format: YYYY-MM-DD
          HH:MM)'
        example: 2025-12-25 14:30
        type: string
    type: object
  handlers.UpdatePointRequest:
    description: Request body for updating charging point properties
    properties:
      is_manual_price:
        description: Whether the price is manually set or dynamically calculated
        example: true
        type: boolean
      kwhprice:
        description: Price per kWh in the local currency
        example: 0.35
        type: number
      status:
        description: Status of the charging point (available, charging, reserved,
          malfunction, offline)
        example: available
        type: string
    type: object
  handlers.UpdatePointResponse:
    description: Response body containing the updated charging point details
    properties:
      is_manual_price:
        description: Indicates if the price is manually set
        example: true
        type: boolean
      kwhprice:
        description: Current price per kWh
        example: 0.35
        type: number
      pointid:
        description: Unique identifier of the charging point
        example: "123"
        type: string
      status:
        description: Current status of the charging point
        example: available
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API for managing electric vehicle charging points
  title: EV Charging API
  version: "1.0"
paths:
  /addpoints:
    post:
      consumes:
      - multipart/form-data
      description: |-
        Imports charging points data from a CSV file. The CSV must contain columns for location,
        station, and charger information. Existing records are updated (upsert behavior).

        Required CSV columns:
        - loc_id: Location ID (required)
        - loc_name: Location name
        - address: Location address
        - lat: Latitude coordinate
        - long: Longitude coordinate
        - is_fast: Whether location has fast chargers (boolean)
        - charger_types: Comma-separated list of charger types
        - station_id: Station ID
        - network_id: Network ID
        - charger_id: Charger ID
        - type_id: Charger type ID
        - status: Charger status
        - power: Maximum power in kW
      parameters:
      - description: CSV file containing charging points data
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: Successfully imported charging points
          schema:
            $ref: '#/definitions/handlers.AddPointsResponse'
        "400":
          description: Bad Request - Missing file parameter or invalid CSV format
          schema:
            $ref: '#/definitions/handlers.ErrorLogResponse'
        "500":
          description: Internal Server Error - Upload error, CSV parsing error, or
            database error
          schema:
            $ref: '#/definitions/handlers.ErrorLogResponse'
      summary: Import charging points from CSV
      tags:
      - Admin
  /getpoint/{id}:
    get:
      consumes:
      - application/json
      description: |-
        Retrieves detailed information about a specific charging point including
        location coordinates, current status, capacity, pricing, and reservation details.
      parameters:
      - description: Charging Point ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved charging point details
          schema:
            $ref: '#/definitions/handlers.PointDetailDTO'
        "404":
          description: Not Found - Charging point does not exist
          schema:
            $ref: '#/definitions/handlers.ErrorLogResponse'
        "500":
          description: Internal Server Error - Database error
          schema:
            $ref: '#/definitions/handlers.ErrorLogResponse'
      summary: Get charging point by ID
      tags:
      - Points
  /getpoints:
    get:
      consumes:
      - application/json
      description: |-
        Retrieves a list of all charging points with optional filtering by status and geographic bounds.
        Results can be returned in JSON or CSV format.
      parameters:
      - description: Filter by status (available, occupied, reserved, faulted, offline)
        in: query
        name: status
        type: string
      - default: json
        description: Response format (json or csv)
        in: query
        name: format
        type: string
      - description: Minimum latitude for geographic filtering
        in: query
        name: min_lat
        type: number
      - description: Maximum latitude for geographic filtering
        in: query
        name: max_lat
        type: number
      - description: Minimum longitude for geographic filtering
        in: query
        name: min_lon
        type: number
      - description: Maximum longitude for geographic filtering
        in: query
        name: max_lon
        type: number
      produces:
      - application/json
      - text/csv
      responses:
        "200":
          description: Successfully retrieved list of charging points
          schema:
            items:
              $ref: '#/definitions/handlers.PointVague'
            type: array
        "204":
          description: No Content - No charging points found matching the criteria
        "401":
          description: Invalid Status - Unrecognized status value
          schema:
            $ref: '#/definitions/handlers.ErrorLogResponse'
        "500":
          description: Internal Server Error - Database error
          schema:
            $ref: '#/definitions/handlers.ErrorLogResponse'
      summary: Get all charging points
      tags:
      - Points
  /healthcheck:
    get:
      consumes:
      - application/json
      description: |-
        Performs a health check of the API including database connectivity verification
        and retrieval of charging point statistics. Returns system status and counts of
        online vs offline charging points.
      produces:
      - application/json
      responses:
        "200":
          description: System is healthy
          schema:
            $ref: '#/definitions/handlers.HealthCheckResponse'
        "400":
          description: Database connection failed or query error
          schema:
            $ref: '#/definitions/handlers.ErrorLogResponse'
      summary: Check API health status
      tags:
      - System
  /newsession:
    post:
      consumes:
      - application/json
      description: |-
        Records a new completed charging session with all relevant details including
        start/end times, energy delivered, state of charge changes, and billing information.
      parameters:
      - description: Charging session details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.NewSessionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully created charging session (empty body)
        "400":
          description: Bad Request - Missing required fields or invalid timestamp
            format
          schema:
            $ref: '#/definitions/handlers.ErrorLogResponse'
        "404":
          description: Not Found - Charging point does not exist
          schema:
            $ref: '#/definitions/handlers.ErrorLogResponse'
        "500":
          description: Internal Server Error - Database error
          schema:
            $ref: '#/definitions/handlers.ErrorLogResponse'
      summary: Create a new charging session
      tags:
      - Sessions
  /pointstatus/{pointid}/{from}/{to}:
    get:
      consumes:
      - application/json
      description: |-
        Retrieves the history of status changes for a specific charging point within a date range.
        Status changes are logged whenever a point transitions between states (e.g., available → charging).
        Results can be returned in JSON or CSV format.
      parameters:
      - description: Charging Point ID
        in: path
        name: pointid
        required: true
        type: string
      - description: Start date in YYYYMMDD format
        example: "20251201"
        in: path
        name: from
        required: true
        type: string
      - description: End date in YYYYMMDD format (inclusive)
        example: "20251225"
        in: path
        name: to
        required: true
        type: string
      - default: json
        description: Response format (json or csv)
        in: query
        name: format
        type: string
      produces:
      - application/json
      - text/csv
      responses:
        "200":
          description: Successfully retrieved status change history
          schema:
            items:
              $ref: '#/definitions/handlers.StatusChangeDTO'
            type: array
        "204":
          description: No Content - No status changes found in the specified date
            range
        "400":
          description: Bad Request - Invalid date format
          schema:
            $ref: '#/definitions/handlers.ErrorLogResponse'
        "404":
          description: Not Found - Charging point does not exist
          schema:
            $ref: '#/definitions/handlers.ErrorLogResponse'
        "500":
          description: Internal Server Error - Database error
          schema:
            $ref: '#/definitions/handlers.ErrorLogResponse'
      summary: Get status change history for a charging point
      tags:
      - Points
  /reserve/{id}:
    post:
      consumes:
      - application/json
      description: |-
        Attempts to reserve a charging point for a specified duration.
        The reservation duration must be between 15 and 60 minutes (defaults to 30 if not specified).
        Only 'available' charging points can be reserved.
        The operation is atomic and uses row-level locking to prevent race conditions.
      parameters:
      - description: Charging Point ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Reservation result (check status field for success/failure
            reason)
          schema:
            $ref: '#/definitions/handlers.ReserveResponseDTO'
        "400":
          description: Bad Request - Invalid point ID
          schema:
            $ref: '#/definitions/handlers.ErrorLogResponse'
        "500":
          description: Internal Server Error - Database error
          schema:
            $ref: '#/definitions/handlers.ErrorLogResponse'
      summary: Reserve a charging point
      tags:
      - Reservations
  /reserve/{id}/{minutes}:
    post:
      consumes:
      - application/json
      description: |-
        Attempts to reserve a charging point for a specified duration.
        The reservation duration must be between 15 and 60 minutes (defaults to 30 if not specified).
        Only 'available' charging points can be reserved.
        The operation is atomic and uses row-level locking to prevent race conditions.
      parameters:
      - description: Charging Point ID
        in: path
        name: id
        required: true
        type: string
      - description: 'Reservation duration in minutes (15-60, default: 30)'
        in: path
        name: minutes
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Reservation result (check status field for success/failure
            reason)
          schema:
            $ref: '#/definitions/handlers.ReserveResponseDTO'
        "400":
          description: Bad Request - Invalid point ID
          schema:
            $ref: '#/definitions/handlers.ErrorLogResponse'
        "500":
          description: Internal Server Error - Database error
          schema:
            $ref: '#/definitions/handlers.ErrorLogResponse'
      summary: Reserve a charging point
      tags:
      - Reservations
  /resetpoints:
    post:
      consumes:
      - application/json
      description: |-
        Performs a complete reset of the charging points database by:
        1. Deleting all existing charging sessions, reservations, chargers, stations, and locations
        2. Re-importing all data from the seed JSON file (data/parts1234.json)

        This operation is atomic - if any step fails, all changes are rolled back.
        Use with caution as this will delete all existing session and reservation data.
      produces:
      - application/json
      responses:
        "200":
          description: Successfully reset all charging points
          schema:
            $ref: '#/definitions/handlers.ResetPointsResponse'
        "500":
          description: Internal Server Error - File read error, JSON parsing error,
            or database error
          schema:
            $ref: '#/definitions/handlers.ErrorLogResponse'
      summary: Reset all charging points to initial state
      tags:
      - Admin
  /sessions/{id}/{from}/{to}:
    get:
      consumes:
      - application/json
      description: |-
        Retrieves all charging sessions for a specific charging point within a date range.
        Sessions are ordered by start time in descending order (most recent first).
        Results can be returned in JSON or CSV format.
      parameters:
      - description: Charging Point ID
        in: path
        name: id
        required: true
        type: string
      - description: Start date in YYYYMMDD format
        example: "20251201"
        in: path
        name: from
        required: true
        type: string
      - description: End date in YYYYMMDD format (inclusive)
        example: "20251225"
        in: path
        name: to
        required: true
        type: string
      - default: json
        description: Response format (json or csv)
        in: query
        name: format
        type: string
      produces:
      - application/json
      - text/csv
      responses:
        "200":
          description: Successfully retrieved charging sessions
          schema:
            items:
              $ref: '#/definitions/handlers.SessionDTO'
            type: array
        "204":
          description: No Content - No sessions found in the specified date range
        "400":
          description: Bad Request - Invalid date format
          schema:
            $ref: '#/definitions/handlers.ErrorLogResponse'
        "404":
          description: Not Found - Charging point does not exist
          schema:
            $ref: '#/definitions/handlers.ErrorLogResponse'
        "500":
          description: Internal Server Error - Database error
          schema:
            $ref: '#/definitions/handlers.ErrorLogResponse'
      summary: Get charging sessions for a point
      tags:
      - Sessions
  /updpoint/{id}:
    post:
      consumes:
      - application/json
      description: |-
        Updates the properties of a specific charging point including status, price, and pricing mode.
        At least one field (status, kwhprice, or is_manual_price) must be provided.
        When setting kwhprice without specifying is_manual_price, it defaults to manual pricing mode.
      parameters:
      - description: Charging Point ID
        in: path
        name: id
        required: true
        type: string
      - description: Update request body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdatePointRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully updated charging point
          schema:
            $ref: '#/definitions/handlers.UpdatePointResponse'
        "400":
          description: Bad Request - Invalid input or missing required fields
          schema:
            $ref: '#/definitions/handlers.ErrorLogResponse'
        "404":
          description: Not Found - Charging point does not exist
          schema:
            $ref: '#/definitions/handlers.ErrorLogResponse'
        "500":
          description: Internal Server Error - Database error
          schema:
            $ref: '#/definitions/handlers.ErrorLogResponse'
      summary: Update a charging point
      tags:
      - Points
swagger: "2.0"
